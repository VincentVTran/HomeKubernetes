apiVersion: gateway.solo.io/v1
kind: VirtualService
metadata:
  name: external-vs
  namespace: gloo-system
  labels:
    exposure: external
spec:
  virtualHost:
    domains:
      - 'ezequiel-thirstless-johnnie.ngrok-free.dev'
    routes:
      - matchers:
        - prefix: /
        routeAction:
          single:
            kube:
              ref:
                name: id-verification-portal
                namespace: id-verification-portal
              port: 80