apiVersion: gateway.solo.io/v1
kind: VirtualService
metadata:
  name: external-vs
  namespace: gloo-system
  labels:
    exposure: external
spec:
  virtualHost:
    # Both public tunnels reach the external gateway; the Host header picks this VirtualService.
    domains:
      - 'portal.example.com'                          # Cloudflare Tunnel: replace with your portal hostname (as in ../../CloudflareTunnel/tunnel-config.yaml)
      - 'ezequiel-thirstless-johnnie.ngrok-free.dev'  # ngrok: remove once ngrok is retired (../../CloudflareTunnel/README.md, phase 7)
    routes:
      - matchers:
        - prefix: /
        routeAction:
          single:
            kube:
              ref:
                name: id-verification-portal
                namespace: id-verification-portal
              port: 80
