apiVersion: gateway.solo.io/v1
kind: VirtualService
metadata:
  name: external-vs
  namespace: gloo-system
  labels:
    exposure: external
spec:
  virtualHost:
    # The Cloudflare Tunnel reaches the external gateway; the Host header picks this VirtualService.
    domains:
      - 'rental.vtranlabs.com'   # as in ../../CloudflareTunnel/tunnel-config.yaml
    routes:
      - matchers:
        - prefix: /
        routeAction:
          single:
            kube:
              ref:
                name: id-verification-portal
                namespace: id-verification-portal
              port: 80
