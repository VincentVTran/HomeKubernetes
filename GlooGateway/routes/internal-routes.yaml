apiVersion: gateway.solo.io/v1
kind: VirtualService
metadata:
  name: main-vs
  namespace: gloo-system
  labels:
    exposure: internal
spec:
  virtualHost:
    domains:
    - '*'                # match any Host header (or use grafana.example.local)
    routes:
    - matchers:
      - prefix: /prometheus
      routeAction:
        single:
          kube:
            ref:
              name: prometheus-server
              namespace: prometheus
            port: 80
    # - matchers:
    #   - prefix: /grafana
    #   routeAction:
    #     single:
    #       upstream:
    #         name: grafana-grafana-80 # Namespace-Service-Port (only when discovery is enabled)
    #         namespace: gloo-system
    - matchers:
      - prefix: /grafana
      routeAction:
        single:
          kube:
            ref:
              name: grafana
              namespace: grafana
            port: 80
    # VictoriaLogs' web UI at /logs. Only its read API (/select/...) is routed: VictoriaLogs has no login, so its write
    # (/insert), delete and admin endpoints stay unreachable from the LAN. The UI works under the prefix because it
    # calls its API relative to its own address (/logs/select/logsql/query and so on).
    - matchers:
      - exact: /logs
      - exact: /logs/
      redirectAction:
        pathRedirect: /logs/select/vmui/
    - matchers:
      - prefix: /logs/select/
      routeAction:
        single:
          kube:
            ref:
              name: victoria-logs
              namespace: victoria-logs
            port: 9428
      options:
        prefixRewrite: /select/