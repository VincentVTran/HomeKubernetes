# Being retired: the Cloudflare Tunnel replaces it (../CloudflareTunnel/README.md, phase 7 removes this).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-gateway-tunnel
  namespace: gloo-system
spec:
  ingressClassName: ngrok
  rules:
    - host: ezequiel-thirstless-johnnie.ngrok-free.dev  # replace with your ngrok domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: external-gateway-proxy
                port:
                  number: 80
