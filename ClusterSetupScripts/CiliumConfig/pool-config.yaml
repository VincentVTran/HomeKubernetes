# Selects node to announce from
# Find all devices available here: kubectl -n kube-system exec ds/cilium -- cilium-dbg shell -- db/show devices
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: primary-policy
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  interfaces: # All interfaces that you wish to accept ARP ping (uses Go's regexp)
  - ^eth[0-9]+
  - ^e.*$
  externalIPs: true
  loadBalancerIPs: true
--- 
# Selects IP available for services
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "default-pool"
spec:
  blocks:
  - start: "192.168.2.2"
    stop: "192.168.2.200"