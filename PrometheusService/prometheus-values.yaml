# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml
# Configure the service to use a specific LoadBalancer IP
# Server configurations
server:
  enabled: true
  # Set to 0 to scale Prometheus down, 1 to bring it back
  replicaCount: 1
  prefixURL: /prometheus
  baseURL: /prometheus
  persistentVolume:
    enabled: true
    size: 2Gi
  retention: 1d
  # It had no request or limit, so it ran as BestEffort: first to be killed when the node runs short, and free to grow. About 150-250Mi
  # with the series trimmed below; the limit leaves room for a burst (e.g. compaction).
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi
  # service:
  #   type: LoadBalancer
  #   loadBalancerIP: 192.168.2.3
# Disable other prometheus services
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

# Chart 29.x adds these default scrape jobs on top of serverFiles below.
# Disable them all so only our own jobs (serverFiles.prometheus.yml) are used.
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

# Configure the scrape configs to discover and monitor services in the cluster
serverFiles:
  prometheus.yml:
    scrape_configs:
      # Job for scraping only pods with annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Select only pods with prometheus.io/scrape=true annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use the path specified in prometheus.io/path annotation if present
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Use the port specified in prometheus.io/port annotation if present
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Add pod name as target label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Add namespace as label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # Add container name as label
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container_name
        metric_relabel_configs:
          # Gloo's Envoy proxies export ~6k histogram buckets per scrape that no dashboard reads; their _count and _sum stay.
          - source_labels: [__name__]
            action: drop
            regex: envoy_.*_bucket
          
      # Job for scraping Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        metric_relabel_configs:
          # ~50k of this job's ~63k series are latency and size histogram buckets no dashboard reads. Their _count and _sum stay, so
          # request rates and average latencies still work. Remove a name here to get its buckets back (e.g. for p99 latency).
          - source_labels: [__name__]
            action: drop
            regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds|apiserver_flowcontrol_.*|workqueue_.*_seconds|apiserver_storage_.*_seconds|apiserver_admission_.*_seconds|rest_client_.*_seconds|apiserver_webhooks_.*_seconds|apiserver_watch_list_duration_seconds|apiserver_crd_conversion_webhook_duration_seconds|authentication_duration_seconds|apiserver_delegated_.*_seconds|apiserver_cache_list_.*|apiserver_selfrequest_.*)_bucket
      
      # Job for scraping Kubernetes nodes (kubelet)
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Scrape the kubelet directly (node-ip:10250). Chart 29.x no longer
          # grants nodes/proxy, so the old API-server proxy path returns 403.
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          # On k3s the kubelet, API server and etcd are one process with one metrics registry, so the kubelet's /metrics returns the
          # whole kubernetes-apiservers job again (~63k identical series). Keep only the kubelet's own metrics.
          - source_labels: [__name__]
            action: keep
            regex: kubelet_.*|prober_.*|volume_manager_.*|storage_operation_.*|process_.*|go_.*|up
        
      # Job for scraping cAdvisor metrics
      - job_name: kubernetes-nodes-cadvisor
        scrape_interval: 10s
        scrape_timeout: 10s
        scheme: https  # remove if you want to scrape metrics on insecure port
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Scrape the kubelet directly, same as the kubernetes-nodes job.
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        metric_relabel_configs:
          - action: replace
            source_labels: [id]
            regex: '^/machine\.slice/machine-rkt\\x2d([^\\]+)\\.+/([^/]+)\.service$'
            target_label: rkt_container_name
            replacement: '${2}-${1}'
          - action: replace
            source_labels: [id]
            regex: '^/system\.slice/(.+)\.service$'
            target_label: systemd_service_name
            replacement: '${1}'

      # Job for scraping service endpoints
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name

