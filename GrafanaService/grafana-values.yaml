# Bind container networking to the host so 0.0.0.0:8889 → 192.168.2.20:8889
service:
  type: "LoadBalancer"
  loadBalancerIP: 192.168.2.21

# Enable sidecar to watch for datasource ConfigMaps/Secrets
sidecar:
  datasources:
    enabled: true           # :contentReference[oaicite:4]{index=4}

# Inline provisioning of datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: OtelCollector
        type: prometheus
        access: proxy
        url: http://192.168.2.20:8889   # OTEL Collector endpoint
        isDefault: true
        jsonData:
          timeInterval: "15s"

