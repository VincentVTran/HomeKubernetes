apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: github-sensor
spec:
  dependencies:
    - name: github-dep
      eventSourceName: pi-controller-github
      eventName: repo

  triggers:
    - template:
        name: workflow-trigger
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-pipeline-
              spec:
                entrypoint: main
                templates:
                  - name: main
                    container:
                      image: alpine
                      command: [echo]
                      args: ["Triggered from GitHub 🚀"]