# Uses ngrok, which is being retired (../CloudflareTunnel/README.md, phase 7 removes this). To keep a public test page,
# add a hostname for it in ../CloudflareTunnel/tunnel-config.yaml and an external VirtualService instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-tunnel
  namespace: test
spec:
  ingressClassName: ngrok
  rules:
    - host: ezequiel-thirstless-johnnie.ngrok-free.dev  # replace with your ngrok domain
      http:
        paths:
          - path: /test
            pathType: Prefix
            backend:
              service:
                name: simple-web-service
                port:
                  number: 80
