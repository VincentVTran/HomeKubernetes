apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-tunnel
  namespace: test
spec:
  ingressClassName: ngrok
  rules:
    - host: ezequiel-thirstless-johnnie.ngrok-free.dev  # replace with your ngrok domain
      http:
        paths:
          - path: /test
            pathType: Prefix
            backend:
              service:
                name: simple-web-service
                port:
                  number: 80
