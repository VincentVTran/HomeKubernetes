# cloudflared's own config file (https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/local-management/configuration-file/).
# upgrade-cloudflared.sh puts it in the ConfigMap `cloudflared-config`; a change here restarts the pods on the next upgrade.
#
# The tunnel id is not here: the pods read it from the `cloudflared-tunnel` Secret, made by install-cloudflared.sh from
# the credentials file `cloudflared tunnel create` wrote.
credentials-file: /etc/cloudflared/credentials/credentials.json
metrics: 0.0.0.0:2000   # /ready (readiness probe, verify-tunnel.sh) and /metrics (Prometheus, by pod annotation)

# Every public hostname goes to Gloo's EXTERNAL gateway, which serves only `exposure: external` VirtualServices. Never point
# a rule at anything else: the internal gateway (Grafana, Prometheus, /logs) must stay on the home network.
# Each hostname here also needs:
#   - a DNS record: `cloudflared tunnel route dns <tunnel> <hostname>` (a proxied CNAME to <tunnel-id>.cfargotunnel.com);
#   - the same hostname in an external VirtualService's `domains` (../GlooGateway/routes/external-routes.yaml).
# The original Host header is passed on unchanged, which is what Gloo matches.
ingress:
  - hostname: rental.vtranlabs.com   # the ID verification portal
    service: http://external-gateway-proxy.gloo-system.svc.cluster.local:80
  # Anything else that reaches the tunnel gets a 404 and never touches the cluster.
  - service: http_status:404
