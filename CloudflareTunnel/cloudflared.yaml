# cloudflared: dials out to Cloudflare and carries the public hostnames in tunnel-config.yaml to Gloo's external gateway.
# Applied by upgrade-cloudflared.sh, which fills in __CONFIG_CHECKSUM__ (so a change to the config or the Secret restarts the pods). Needs the
# `cloudflared-tunnel` Secret (keys `credentials.json` and `tunnel-id`) from install-cloudflared.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Two connectors on the same tunnel: Cloudflare spreads requests over both, so one restarting doesn't take the portal down.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        checksum/config: "__CONFIG_CHECKSUM__"
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Pinned; bump deliberately (https://github.com/cloudflare/cloudflared/releases). The image's entrypoint already
          # passes --no-autoupdate, so it never replaces itself.
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
            - $(TUNNEL_ID)
          env:
            - name: TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: tunnel-id
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 once the pod holds at least one connection to Cloudflare. Liveness only asks whether the
          # process answers (/healthcheck), so an internet outage makes the pods unready but doesn't restart them in a loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-tunnel
            items:
              - key: credentials.json
                path: credentials.json
