# Default values: https://github.com/ngrok/ngrok-operator/blob/main/helm/ngrok-operator/values.yaml
#
# Credentials are NOT stored here — pass them via environment variables in the install/upgrade scripts:
#   export NGROK_API_KEY=<your-api-key>
#   export NGROK_AUTHTOKEN=<your-authtoken>

description: "Home lab ngrok tunnel operator"

# Keep domains in ngrok when their Domain resource is deleted. The free
# *.ngrok-free.dev domain is managed by ngrok and shared by every tunnel here,
# so deleting one Domain resource must not try to delete it upstream.
defaultDomainReclaimPolicy: Retain

agent:
  # The agent leaks memory while it retries a tunnel that never becomes Ready
  # (seen at 1.6Gi after 30 days). The limit makes Kubernetes restart it early.
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi

bindings:
  enabled: true
